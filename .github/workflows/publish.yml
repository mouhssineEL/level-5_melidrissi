name: Publish

on:
  workflow_call:
    inputs:
      git_ref:
        type: string
        required: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Bootstrap runner environment
        run: bash scripts/bootstrap.sh

      - name: Build Program
        run: cargo build --release

      - name: Stage package artifacts for publish
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: target/release/program

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15 
    needs:
      - build
    steps:
      - name: Download staged package artifacts
        uses: actions/download-artifact@v4
        with:
          name: program
          path: target/artifacts

      - name: Release
        run: |
          TAG_NAME="${TAG#refs/tags/}"
          gh release create "$TAG_NAME" target/artifacts/program --title="${GITHUB_REPOSITORY#*/} $TAG_NAME" --generate-notes -R cloud-squad-ct/github-level-5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.git_ref }}

  publish-docker:
    name: Publish container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true

      - name: Download staged package artifacts
        uses: actions/download-artifact@v4
        with:
          name: program
          path: /opt

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/program:latest